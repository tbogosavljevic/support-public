version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: e2-standard-4
    os_image: ubuntu2004
blocks:
  - name: Gold
    dependencies: []
    task:
      jobs:
        - name: Gold
          commands:
            - echo "This is a block running checks."
            - echo "If something is wrong, fail this block with 'exit 1' and it will stop execution."
            - echo "But let's say the checks are OK, so continue with the pipeline (trigger auto promotions)"
      agent:
        machine:
          type: e2-standard-2
          os_image: ubuntu2404

version: v1.0
name: Initial Pipeline
agent:
  machine:
    type: e2-standard-2
    os_image: ubuntu2204
blocks:
  - name: Cases
    task:
      jobs:
        - name: 'True'
          commands:
            - checkout
            - export PIPEFAIL_CHECK=true
            - bash ./script.sh
        - name: 'False'
          commands:
            - checkout
            - export PIPEFAIL_CHECK=false
            - bash ./script.sh
        - name: Empty
          commands:
            - checkout
            - bash ./script.sh
